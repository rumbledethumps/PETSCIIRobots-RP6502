name: ci

on:
  push:
  pull_request:

env:
  # The rp6502 target lives in picocomputer/cc65, not upstream cc65, and the
  # SDK is explicit that a distribution package is not good enough. Ubuntu's
  # cc65 assembles fine but has no rp6502 target library, so it cannot link a
  # ROM. Build the fork once and cache it for both jobs.
  CC65_REPO: picocomputer/cc65
  CC65_REF: master

jobs:
  cc65:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Resolve the cc65 revision
        id: rev
        run: |
          sha=$(git ls-remote https://github.com/${CC65_REPO} ${CC65_REF} | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache the cc65 build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cc65-install
          key: cc65-${{ runner.os }}-${{ steps.rev.outputs.sha }}

      - name: Build cc65
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git
          git clone --depth 1 --branch ${CC65_REF} https://github.com/${CC65_REPO} /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          make -C /tmp/cc65 install PREFIX="$HOME/cc65-install"

      - uses: actions/upload-artifact@v4
        with:
          name: cc65
          path: ~/cc65-install
          retention-days: 1

  # The converter is the safety net for the whole port: it must keep rebuilding
  # David Murray's X16 binaries byte for byte from his published sources.
  reference-conversion:
    needs: cc65
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cc65, path: ~/cc65-install }
      - run: |
          chmod +x ~/cc65-install/bin/*
          echo "$HOME/cc65-install/bin" >> "$GITHUB_PATH"
      - name: Convert ACME to ca65 and compare against the shipped binaries
        run: python3 tests/reference/verify_conversion.py

  # The emulator is headless under --script: it drives sys_run_frame() itself
  # and never opens a window, so no X server and no xvfb. It does still link
  # GL/X11/ALSA, so those shared libraries have to be installed.
  rom:
    needs: cc65
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: cc65, path: ~/cc65-install }
      - run: |
          chmod +x ~/cc65-install/bin/*
          echo "$HOME/cc65-install/bin" >> "$GITHUB_PATH"
          echo "CC65_HOME=$HOME/cc65-install/share/cc65" >> "$GITHUB_ENV"

      - name: Install build tools and the emulator's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 \
            libgl1 libx11-6 libxi6 libxcursor1 libasound2t64

      # tools/*.cmake and tools/rp6502.py are committed, so nothing here is
      # needed to build. This step exists only to fetch tools/rp6502-emu, which
      # a plain `cmake --preset` never does: rp6502_fetch_emulator() runs under
      # RP6502_TOOLS_FETCHED, and only script mode sets that.
      - name: Cache the emulator
        id: emu
        uses: actions/cache@v4
        with:
          path: tools/rp6502-emu
          key: rp6502-emu-${{ runner.os }}-${{ hashFiles('tools/rp6502.cmake') }}

      - name: Fetch the emulator
        if: steps.emu.outputs.cache-hit != 'true'
        run: cmake -P tools/rp6502.cmake

      - name: Build the ROM
        run: |
          cmake --preset cc65/Release
          cmake --build --preset cc65/Release

      # ctest runs the lot: the asset invariants the platform layer assumes, the
      # converter's byte-identity check against the shipped X16 binaries, and
      # the emulator scripts.
      - name: Run the tests
        run: ctest --preset cc65/Release

      - uses: actions/upload-artifact@v4
        with:
          name: robots.rp6502
          path: build/cc65/release/src/robots.rp6502

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emu-scratch
          path: build/cc65/release/tests/emu/scratch/

      # `cmake -P` also refreshes the committed tools from picocomputer/rp6502
      # main. Surfacing the drift is free; it should not fail the build.
      - name: Report SDK tool drift
        continue-on-error: true
        run: git diff --exit-code -- tools/
